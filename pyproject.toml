[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yumi-capture"
version = "0.1.0"
description = "ROS-free calibrated T265/D405 UMI capture and LeRobot v3 export"
requires-python = ">=3.10,<3.11"
dependencies = [
  "numpy==1.26.4", "scipy==1.15.3", "opencv-python-headless==4.11.0.86",
  "pyrealsense2==2.53.1.4623", "viser==1.0.16", "pillow>=10,<12",
]
[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.11"]
[project.scripts]
yumi = "yumi.cli:main"
[tool.hatch.build.targets.wheel]
packages = ["src/yumi"]
[tool.pytest.ini_options]
testpaths = ["tests"]
