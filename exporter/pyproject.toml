[project]
name = "yumi-exporter"
version = "0.1.0"
requires-python = ">=3.10,<3.11"
dependencies = ["lerobot==0.4.3", "numpy==2.2.6", "torch==2.7.1", "torchvision==0.22.1", "torchcodec==0.5.0", "av==15.1.0"]
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
